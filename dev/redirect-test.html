<!DOCTYPE html><html><head><meta charset="utf-8"><title>redirect test</title>
<style>body{background:#0b0d0f;color:#e8eef4;font:13px ui-monospace,monospace;padding:1rem}</style></head>
<body><pre id="o"></pre>
<script type="module">
import { authRedirectUrl } from '/src/game/api.js';
const out = [];
const url = authRedirectUrl();
out.push('VITE_SITE_URL = ' + JSON.stringify(import.meta.env.VITE_SITE_URL ?? null));
out.push('window.location.origin = ' + window.location.origin);
out.push('authRedirectUrl() = ' + url);
out.push('');
out.push(url.endsWith('/oyun') ? 'OK  /oyun ile bitiyor' : 'FAIL /oyun ile bitmiyor');
const expected = (import.meta.env.VITE_SITE_URL || window.location.origin).replace(/\/+$/,'') + '/oyun';
out.push(url === expected ? 'OK  beklenen değere eşit' : 'FAIL beklenen: ' + expected);
out.push(url.includes('//') && !url.includes('///') ? 'OK  çift eğik çizgi yok' : 'FAIL bozuk URL');
document.getElementById('o').textContent = out.join('\n');
window.__r = { url, expected, ok: url === expected };
</script></body></html>
